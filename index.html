<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Bemberse - tu universo de tareas. 100% local, sin nube, sin telemetria." />
    <meta name="color-scheme" content="dark" />
    <title>Bemberse — Tu universo</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- HERO — primera de las 7 secciones del sitio (las otras 6 llegan
           en el paso 06). Reutiliza las clases .landing existentes de
           style.css: este paso no toca ese archivo. -->
      <section id="hero" class="landing">
        <div id="landing-bg" class="landing__bg" aria-hidden="true"></div>
        <div class="landing__content">
          <img src="logo.png" class="brand__logo" alt="bemberse" width="1400" height="212" />

          <h1 class="landing__title">
            Tu caos, convertido en un <span class="grad-text">mapa.</span>
          </h1>
          <p class="landing__sub">
            Suelta todo lo que traes en la cabeza. Bemberse lo convierte en un
            universo de tareas conectadas y te enciende, una a la vez, la única
            que puedes hacer ahora.
          </p>

          <a href="app/" id="btn-landing-start" class="btn btn--primary btn--xl">Comenzar</a>

          <p class="landing__foot">100% local · sin cuenta · sin nube</p>
        </div>
      </section>
    </div>
    <script type="module" src="/src/site.ts"></script>
  </body>
</html>
