          <div class="ingest__field">
            <label for="ingest-text" class="visually-hidden">{{ingest.dumpLabel}}</label>
            <textarea
              id="ingest-text"
              class="ingest__textarea"
              placeholder="{{ingest.placeholder}}"
              rows="8"
            ></textarea>
            <div class="ingest__field-bar">
              <button id="btn-mic" class="ingest__mic" aria-pressed="false" title="{{ingest.dictateTitle}}">{{ingest.dictate}}</button>
              <span id="mic-status" class="mic-status" aria-live="polite"></span>
            </div>
          </div>

          <div class="ingest__step">
            <button id="btn-copy-prompt" class="btn btn--primary btn--lg">{{ingest.copy}}</button>
            <p id="copy-status" class="ingest__note" aria-live="polite">{{ingest.copyNote}}</p>
          </div>

          <div class="ingest__import">
            <label for="import-text" class="ingest__label">{{ingest.importLabel}}</label>
            <textarea
              id="import-text"
              class="ingest__textarea ingest__textarea--code"
              placeholder='{ "version": "1.0", "nodes": [...], "edges": [...] }'
              rows="3"
            ></textarea>
            <div class="ingest__row">
              <button id="btn-do-import" class="btn btn--secondary">{{ingest.build}}</button>
              <label class="btn btn--ghost file-btn">
                {{ingest.upload}}
                <input id="import-file" type="file" accept="application/json" hidden />
              </label>
              <span id="import-status" class="mic-status"></span>
            </div>
            <pre id="import-error" class="import-error hidden"></pre>
          </div>

          <div class="ingest__presets">
            <span class="ingest__label">{{ingest.presetsLabel}}</span>
            <div class="ingest__row">
              <button class="ingest__preset" data-preset="product-launch" id="preset-product-launch">{{ingest.presetLaunch}}</button>
              <button class="ingest__preset" data-preset="chaotic-week" id="preset-chaotic-week">{{ingest.presetWeek}}</button>
              <button class="ingest__preset" data-preset="break-the-freeze" id="preset-break-the-freeze">{{ingest.presetFreeze}}</button>
            </div>
          </div>
